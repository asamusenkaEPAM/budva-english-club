name: Update English Club event

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-event.yml
      - scripts/update-telegram-event.mjs
      - scripts/publish-build.mjs
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-english-club-event
  cancel-in-progress: false

jobs:
  refresh-event:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read latest Telegram announcement
        run: node scripts/update-telegram-event.mjs

      - name: Build and publish website
        run: npm run publish

      - name: Commit updated event
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/public/data/latest-event.json index.html robots.txt sitemap.xml assets data images en ru me tr de
          if git diff --cached --quiet; then
            echo "The published announcement is already current."
            exit 0
          fi
          git commit -m "Update English club event"
          git push
